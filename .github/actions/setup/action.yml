name: Setup project
description: Set up pnpm, Node.js (with pnpm cache) and install dependencies.

inputs:
  install:
    description: Whether to run "pnpm install".
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v5
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      if: inputs.install == 'true'
      run: pnpm install
      shell: bash
