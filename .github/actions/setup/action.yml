name: Setup project
description: Set up pnpm, Node.js (with pnpm cache) and install dependencies.

inputs:
  install:
    description: Whether to run "pnpm install".
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v5
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22
        # Astro 7 needs Node >=22.23.4. Without check-latest, setup-node takes the
        # runner image's cached 22.x, and some images still ship 22.23.3: jobs then
        # fail at random ("Node.js v22.23.3 is not supported by Astro!").
        check-latest: true
        cache: pnpm

    - name: Install dependencies
      if: inputs.install == 'true'
      run: pnpm install
      shell: bash
