name: Check Broken Links

on:
  push:
    branches: [main]
    paths:
      - 'src/content/**'
      - 'src/pages/**'
      - 'scripts/check-links.cjs'
  pull_request:
    paths:
      - 'src/content/**'
      - 'src/pages/**'
      - 'scripts/check-links.cjs'
  workflow_dispatch:

concurrency:
  group: check-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    name: Internal link audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check for broken internal links
        run: node scripts/check-links.cjs
