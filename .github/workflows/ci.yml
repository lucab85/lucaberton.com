# Single CI/CD pipeline for the Astro site (GitHub Actions only).
#
# Sequential, no duplicated work, build runs ONCE:
#   check-links -> build (+ SEO validation) -> e2e -> deploy -> {indexnow, lighthouse} in parallel
#
# - Runs on every PR (check-links -> build -> e2e) as a pre-merge gate.
# - On push to main it continues through deploy + post-deploy notifications.
# - SEO validation (scripts/validate-seo-fixes.cjs) runs on the built public/ in
#   the build job, gating the deploy. The git pre-commit hook runs the same
#   checks in --source-only mode for fast local feedback. Guardrails include:
#   broken local images, orphan pages (incl. /talk/), draft filters, meta/title
#   length, and (built-only) that the sitemap excludes meta-refresh redirect stubs.
# - E2E and Lighthouse reuse the single build artifact (no rebuilds).
# - Caching: pnpm store (setup action), Astro asset cache, Playwright browsers.
# - IndexNow: submits changed URLs on each deploy; submits all sitemap URLs when
#   layouts/components change or when no changed files are detected.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Opt all JavaScript-based actions into the Node.js 24 runtime ahead of GitHub's
# 2026-06-16 forced migration (Node 20 is deprecated and removed 2026-09-16).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-links:
    name: Internal link audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Check broken internal links
        run: node scripts/check-links.cjs

      - name: Validate image sizes
        run: node scripts/check-image-sizes.cjs --all

  build:
    name: Build
    needs: check-links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Cache Astro build assets
        uses: actions/cache@v5
        with:
          path: node_modules/.astro
          key: astro-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            astro-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build Astro site
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}
          PUBLIC_LINKEDIN_PARTNER_ID: ${{ secrets.PUBLIC_LINKEDIN_PARTNER_ID }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}

      - name: Validate SEO fixes (built HTML)
        run: node scripts/validate-seo-fixes.cjs

      - name: Validate social card (OG image / link preview)
        run: node scripts/validate-social-card.cjs

      - name: Upload site artifact
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: public/
          retention-days: 1

  e2e:
    name: Playwright E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Download site artifact
        uses: actions/download-artifact@v7
        with:
          name: site
          path: public/

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests (built preview)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: e2e
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v7
        with:
          name: site
          path: public/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    name: Submit to IndexNow
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect changed URLs and submit to IndexNow
        continue-on-error: true
        run: |
          KEY="ce29c05385d649b690e22576d20cde14"
          SITE="https://lucaberton.com"

          # Get changed files in this commit
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

          # Helper: fetch all URLs from every sitemap shard
          fetch_all_sitemap_urls() {
            curl -sL "${SITE}/sitemap-index.xml" \
              | grep -oP '(?<=<loc>)[^<]+' \
              | while read sub; do curl -sL "$sub" | grep -oP '(?<=<loc>)[^<]+'; done \
              | sort -u
          }

          if [ -z "$CHANGED" ]; then
            echo "No changed files detected, submitting all sitemap URLs."
            URLS=$(fetch_all_sitemap_urls)
          else
            # Map changed files to URLs
            # Always include homepage
            echo "${SITE}/" >> /tmp/changed_urls.txt

            # Blog posts
            echo "$CHANGED" | grep '^src/content/blog/.*\.mdx$' | while read f; do
              slug=$(basename "$f" .mdx)
              echo "${SITE}/blog/${slug}/"
            done >> /tmp/changed_urls.txt

            # Pages
            echo "$CHANGED" | grep '^src/pages/.*\.astro$' | while read f; do
              route=$(echo "$f" | sed 's|^src/pages/||;s|/index\.astro$||;s|\.astro$||')
              [ -n "$route" ] && echo "${SITE}/${route}/"
            done >> /tmp/changed_urls.txt

            # Layout/component changes affect all pages — submit everything
            if echo "$CHANGED" | grep -qE '^src/(components|layouts)/'; then
              echo "Layout/component change detected, submitting all sitemap URLs."
              fetch_all_sitemap_urls >> /tmp/changed_urls.txt
            fi

            URLS=$(sort -u /tmp/changed_urls.txt 2>/dev/null)
          fi

          if [ -z "$URLS" ]; then
            echo "No URLs to submit."
            exit 0
          fi

          URL_COUNT=$(echo "$URLS" | wc -l)
          echo "Submitting ${URL_COUNT} URLs to IndexNow..."
          echo "$URLS" | head -10
          [ "$URL_COUNT" -gt 10 ] && echo "... and $((URL_COUNT - 10)) more"

          URL_ARRAY=$(echo "$URLS" | jq -R -s 'split("\n") | map(select(length > 0))')

          PAYLOAD=$(jq -n \
            --arg host "lucaberton.com" \
            --arg key "$KEY" \
            --arg keyLocation "${SITE}/${KEY}.txt" \
            --argjson urlList "$URL_ARRAY" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')

          for ENGINE in "api.indexnow.org" "www.bing.com"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "https://${ENGINE}/indexnow" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            echo "${ENGINE}: HTTP ${STATUS}"
          done

  lighthouse:
    name: Lighthouse CI (live)
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup project
        uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Run Lighthouse CI against live site
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_BASE_URL: https://lucaberton.com
        run: npx --yes @lhci/cli@0.14.x autorun --config=./lighthouserc.cjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
          retention-days: 14
