name: Lighthouse

on:
  # Run against the GitHub Pages deployment for this commit.
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to audit (defaults to production)'
        required: false
        default: 'https://lucaberton.com'

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.event.deployment_status.deployment.environment || github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI (desktop, live URL)
    # Only run on manual dispatch, or when GitHub Pages reports a successful
    # production deployment. Skips builds-in-progress and unrelated environments.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'github-pages')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve target URL
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            URL="${{ github.event.inputs.url }}"
          else
            URL="https://lucaberton.com"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Auditing: $URL"

      - name: Run Lighthouse CI against live site
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_BASE_URL: ${{ steps.target.outputs.url }}
        run: npx --yes @lhci/cli@0.14.x autorun --config=./lighthouserc.cjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
          retention-days: 14
