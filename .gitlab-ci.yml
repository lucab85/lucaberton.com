pages:
  image: node:lts

  before_script:
    - npm ci

  script:
    - npm run build

  after_script:
    # IndexNow - notify search engines of all indexed pages (all sitemap shards, no cap)
    - |
      SITEMAPS=$(ls public/sitemap-*.xml 2>/dev/null | grep -v sitemap-index)
      if [ -n "$SITEMAPS" ]; then
        URLS=$(grep -h -oP '<loc>\K[^<]+' $SITEMAPS | jq -R . | jq -s .)
        curl -s -X POST "https://api.indexnow.org/indexnow" \
          -H "Content-Type: application/json" \
          -d "{
            \"host\": \"lucaberton.com\",
            \"key\": \"ce29c05385d649b690e22576d20cde14\",
            \"keyLocation\": \"https://lucaberton.com/ce29c05385d649b690e22576d20cde14.txt\",
            \"urlList\": $URLS
          }" || true
        echo "IndexNow: submitted $(echo $URLS | jq length) URLs"
      fi

  artifacts:
    paths:
      - public

  only:
    - main