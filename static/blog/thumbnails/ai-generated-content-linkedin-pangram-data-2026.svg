<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">LinkedIn has the most AI-generated longform content</title>
  <desc id="desc">Editorial thumbnail showing the share of fully AI-generated longform posts by platform: LinkedIn 41 percent, Medium 31 percent, X Twitter 29 percent, Substack 10 percent.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="54" y="54" width="1092" height="522" rx="18" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
  <text x="92" y="126" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#111827">Where the AI Slop Lives</text>
  <text x="94" y="166" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#475569">Share of longform posts flagged fully AI-generated, by platform</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="92" y="222" font-size="19" font-weight="700" fill="#111827">LinkedIn</text>
    <rect x="220" y="200" width="410" height="30" rx="6" fill="#dc2626"/>
    <text x="640" y="222" font-size="19" font-weight="700" fill="#111827">41%</text>

    <text x="92" y="272" font-size="19" font-weight="700" fill="#111827">Medium</text>
    <rect x="220" y="250" width="310" height="30" rx="6" fill="#f97316"/>
    <text x="540" y="272" font-size="19" font-weight="700" fill="#111827">31%</text>

    <text x="92" y="322" font-size="19" font-weight="700" fill="#111827">X / Twitter</text>
    <rect x="220" y="300" width="290" height="30" rx="6" fill="#fb923c"/>
    <text x="520" y="322" font-size="19" font-weight="700" fill="#111827">29%</text>

    <text x="92" y="372" font-size="19" font-weight="700" fill="#111827">Reddit</text>
    <rect x="220" y="350" width="130" height="30" rx="6" fill="#fcd34d"/>
    <text x="360" y="372" font-size="19" font-weight="700" fill="#111827">13%</text>

    <text x="92" y="422" font-size="19" font-weight="700" fill="#111827">Substack</text>
    <rect x="220" y="400" width="100" height="30" rx="6" fill="#fde68a"/>
    <text x="330" y="422" font-size="19" font-weight="700" fill="#111827">10%</text>
  </g>

  <g transform="translate(788 220)">
    <rect x="0" y="0" width="266" height="210" rx="14" fill="#111827"/>
    <text x="24" y="56" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#ffffff">62%</text>
    <text x="24" y="90" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e5e7eb">of all AI-flagged</text>
    <text x="24" y="112" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e5e7eb">content came from</text>
    <text x="24" y="134" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e5e7eb">LinkedIn — despite</text>
    <text x="24" y="156" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e5e7eb">being only 35% of</text>
    <text x="24" y="178" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e5e7eb">posts scanned</text>
  </g>

  <text x="92" y="500" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#64748b">Source: Pangram Labs Chrome-extension data, Apr–Jun 2026, longform items of 250+ words</text>
</svg>
