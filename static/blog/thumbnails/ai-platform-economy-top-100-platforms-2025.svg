<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" aria-labelledby="title desc" viewBox="0 0 1200 630"><title>AI is making the biggest platforms even bigger</title><desc>The Top 100 platform companies were valued at 22.7 trillion dollars in 2024, and AI is reinforcing the biggest platform ecosystems rather than spreading power evenly.</desc><path fill="#f7f8fb" d="M0 0h1200v630H0z"/><rect width="1104" height="534" x="48" y="48" fill="#fff" stroke="#d8dee9" stroke-width="2" rx="18"/><text x="86" y="118" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">AI &amp; the Platform Economy</text><text x="88" y="154" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="21">The Top 100 platforms are getting bigger, not smaller</text><g transform="translate(86 210)"><rect width="1032" height="140" fill="#eef2fb" stroke="#c7d3ea" stroke-width="1.5" rx="14"/><text x="40" y="60" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">$22.7T</text><text x="40" y="100" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">combined value of the Top 100 platform companies in 2024</text><rect x="700" y="30" width="290" height="80" fill="#111827" rx="10"/><text x="845" y="65" fill="#7fdca4" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Concentration</text><text x="845" y="92" fill="#d1d5db" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle">not redistribution</text></g><text x="88" y="452" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">AI is reinforcing the largest platform ecosystems rather than</text><text x="88" y="480" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">spreading power evenly across the market.</text><text x="88" y="552" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="15">lucaberton.com &#8226; AI &amp; Platform Economy, 2025</text></svg>
