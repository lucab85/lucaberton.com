<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" aria-labelledby="title desc" viewBox="0 0 1200 630"><title>Connecting Hermes Agent to Discord</title><desc>Four-step diagram: create a Discord bot application, enable privileged gateway intents, generate an invite link, and configure the Hermes gateway.</desc><path fill="#f7f8fb" d="M0 0h1200v630H0z"/><rect width="1104" height="534" x="48" y="48" fill="#fff" stroke="#d8dee9" stroke-width="2" rx="18"/><text x="86" y="118" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Hermes Agent + Discord</text><text x="88" y="154" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="21">Complete bot setup, intents, and gateway config</text><g transform="translate(86 196)"><rect width="234" height="176" fill="#eef2fb" stroke="#c7d3ea" stroke-width="1.5" rx="14"/><circle cx="117" cy="52" r="28" fill="#3c6bb0"/><text x="117" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">1</text><text x="117" y="110" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Create bot</text><text x="117" y="134" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Discord Developer</text><text x="117" y="153" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Portal</text></g><g transform="translate(340 196)"><rect width="234" height="176" fill="#fef3c7" stroke="#e9d8a6" stroke-width="1.5" rx="14"/><circle cx="117" cy="52" r="28" fill="#b4841f"/><text x="117" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">2</text><text x="117" y="110" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Enable intents</text><text x="117" y="134" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Message Content</text><text x="117" y="153" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">is the one that bites</text></g><g transform="translate(594 196)"><rect width="234" height="176" fill="#fde2e2" stroke="#f3bcbc" stroke-width="1.5" rx="14"/><circle cx="117" cy="52" r="28" fill="#c0392b"/><text x="117" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">3</text><text x="117" y="110" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Invite &amp; token</text><text x="117" y="134" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Generate URL,</text><text x="117" y="153" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">copy bot token</text></g><g transform="translate(848 196)"><rect width="238" height="176" fill="#111827" rx="14"/><circle cx="119" cy="52" r="28" fill="#2f7d4f"/><text x="119" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">4</text><text x="119" y="110" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">hermes gateway</text><text x="119" y="134" fill="#d1d5db" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">setup, allowlist</text><text x="119" y="153" fill="#d1d5db" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">your user ID</text></g><text x="88" y="452" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">Covers the &quot;bot's online but never responds&quot; intent gotcha and</text><text x="88" y="480" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">the access-policy error that blocks messages by default.</text><text x="88" y="552" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="15">lucaberton.com &#8226; Hermes Agent + Discord, July 2026</text></svg>
