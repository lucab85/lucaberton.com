<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" aria-labelledby="title desc" viewBox="0 0 1200 630"><title>Google's AI evolution: Maps, Photos, Chrome, and Project Genie</title><desc>Four Google products becoming conversational AI assistants: Ask Maps, Veo 3 photo-to-video, Gemini auto browse in Chrome, and Project Genie worlds.</desc><path fill="#f7f8fb" d="M0 0h1200v630H0z"/><rect width="1104" height="534" x="48" y="48" fill="#fff" stroke="#d8dee9" stroke-width="2" rx="18"/><text x="86" y="118" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Google's AI Evolution</text><text x="88" y="154" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="21">Maps, Photos, Chrome, and Project Genie go conversational</text><g transform="translate(86 196)"><rect width="234" height="176" fill="#eef2fb" stroke="#c7d3ea" stroke-width="1.5" rx="14"/><circle cx="117" cy="52" r="28" fill="#3c6bb0"/><text x="117" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Maps</text><text x="117" y="110" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Ask Maps</text><text x="117" y="134" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Conversational</text><text x="117" y="153" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">navigation</text></g><g transform="translate(340 196)"><rect width="234" height="176" fill="#fef3c7" stroke="#e9d8a6" stroke-width="1.5" rx="14"/><circle cx="117" cy="52" r="28" fill="#b4841f"/><text x="117" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Photos</text><text x="117" y="110" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Veo 3</text><text x="117" y="134" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Photo-to-video</text><text x="117" y="153" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">generation</text></g><g transform="translate(594 196)"><rect width="234" height="176" fill="#fde2e2" stroke="#f3bcbc" stroke-width="1.5" rx="14"/><circle cx="117" cy="52" r="28" fill="#c0392b"/><text x="117" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Chrome</text><text x="117" y="110" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Gemini</text><text x="117" y="134" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Auto browse</text><text x="117" y="153" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">&amp; automation</text></g><g transform="translate(848 196)"><rect width="238" height="176" fill="#111827" rx="14"/><circle cx="119" cy="52" r="28" fill="#2f7d4f"/><text x="119" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Genie</text><text x="119" y="110" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Project Genie</text><text x="119" y="134" fill="#d1d5db" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Generated,</text><text x="119" y="153" fill="#d1d5db" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">explorable worlds</text></g><text x="88" y="452" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">Four familiar products, one shared direction: from static tools</text><text x="88" y="480" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">to conversational, generative AI assistants.</text><text x="88" y="552" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="15">lucaberton.com &#8226; Google AI Evolution, 2026</text></svg>
