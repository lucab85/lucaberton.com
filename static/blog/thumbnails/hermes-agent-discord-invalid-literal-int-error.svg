<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" aria-labelledby="title desc" viewBox="0 0 1200 630"><title>Fix: Hermes Agent Discord invalid literal for int() error</title><desc>Two config mistakes: pasting a channel URL instead of its numeric ID, and forgetting to set the user allowlist.</desc><path fill="#f7f8fb" d="M0 0h1200v630H0z"/><rect width="1104" height="534" x="48" y="48" fill="#fff" stroke="#d8dee9" stroke-width="2" rx="18"/><text x="86" y="118" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">invalid literal for int()</text><text x="88" y="154" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="21">Two Discord config mistakes, fixed</text><g transform="translate(86 196)"><rect width="480" height="176" fill="#fde2e2" stroke="#f3bcbc" stroke-width="1.5" rx="14"/><circle cx="50" cy="46" r="24" fill="#c0392b"/><text x="50" y="53" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">1</text><text x="86" y="53" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">URL instead of ID</text><text x="30" y="100" fill="#4b5563" font-family="monospace" font-size="13">discord.com/channels/.../222...</text><text x="30" y="128" fill="#c0392b" font-family="monospace" font-size="14" font-weight="700">&#8594; just: 222222222222222222</text></g><g transform="translate(602 196)"><rect width="466" height="176" fill="#eef2fb" stroke="#c7d3ea" stroke-width="1.5" rx="14"/><circle cx="50" cy="46" r="24" fill="#3c6bb0"/><text x="50" y="53" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">2</text><text x="86" y="53" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">No user allowlist</text><text x="30" y="100" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="15">DISCORD_ALLOWED_USERS never set</text><text x="30" y="128" fill="#3c6bb0" font-family="monospace" font-size="14" font-weight="700">&#8594; add your numeric user ID</text></g><text x="88" y="452" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">A connected bot and an authorized user are two separate checks &#8212;</text><text x="88" y="480" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">being online doesn't mean anyone is allowed to talk to it yet.</text><text x="88" y="552" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="15">lucaberton.com &#8226; Hermes Agent + Discord troubleshooting, July 2026</text></svg>
