<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" aria-labelledby="title desc" viewBox="0 0 1200 630"><title>Hermes Agent on a 1GB VPS: fixing the common gotchas</title><desc>Three-issue troubleshooting diagram: hermes command not found, Playwright Chromium install failing on low RAM, and gateway subcommand order.</desc><path fill="#f7f8fb" d="M0 0h1200v630H0z"/><rect width="1104" height="534" x="48" y="48" fill="#fff" stroke="#d8dee9" stroke-width="2" rx="18"/><text x="86" y="118" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Hermes Agent on a 1GB VPS</text><text x="88" y="154" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="21">Fixing the three most common gotchas</text><g transform="translate(86 196)"><rect width="309" height="200" fill="#fde2e2" stroke="#f3bcbc" stroke-width="1.5" rx="14"/><circle cx="40" cy="46" r="24" fill="#c0392b"/><text x="40" y="53" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">1</text><text x="76" y="53" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">command not found</text><text x="30" y="100" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="15">hermes isn't on PATH yet</text><text x="30" y="125" fill="#111827" font-family="monospace" font-size="15" font-weight="700">source ~/.bashrc</text></g><g transform="translate(415 196)"><rect width="309" height="200" fill="#fef3c7" stroke="#e9d8a6" stroke-width="1.5" rx="14"/><circle cx="40" cy="46" r="24" fill="#b4841f"/><text x="40" y="53" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">2</text><text x="76" y="53" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Chromium fails</text><text x="30" y="100" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="15">1GB RAM, no swap</text><text x="30" y="125" fill="#111827" font-family="monospace" font-size="15" font-weight="700">fallocate -l 2G /swapfile</text></g><g transform="translate(744 196)"><rect width="342" height="200" fill="#111827" rx="14"/><circle cx="40" cy="46" r="24" fill="#2f7d4f"/><text x="40" y="53" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">3</text><text x="76" y="53" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">wrong subcommand</text><text x="30" y="100" fill="#d1d5db" font-family="Arial, Helvetica, sans-serif" font-size="15">setup gateway is backwards</text><text x="30" y="125" fill="#7fdca4" font-family="monospace" font-size="15" font-weight="700">hermes gateway setup</text></g><text x="88" y="452" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">Plus: why you should verify AI-generated CLI instructions against</text><text x="88" y="480" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">the official docs before running them on a live server.</text><text x="88" y="552" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="15">lucaberton.com &#8226; Hermes Agent troubleshooting, July 2026</text></svg>
