<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" aria-labelledby="title desc" viewBox="0 0 1200 630"><title>Hermes Agent troubleshooting</title><desc>Diagnostic flow: check health, fix model or provider errors, repair gateway and credentials.</desc><path fill="#f7f8fb" d="M0 0h1200v630H0z"/><rect width="1104" height="534" x="48" y="48" fill="#fff" stroke="#d8dee9" stroke-width="2" rx="18"/><text x="86" y="118" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Hermes Agent Troubleshooting</text><text x="88" y="154" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="21">Fix model, provider, gateway and credential errors</text><g transform="translate(86 196)"><rect width="234" height="176" fill="#e0ecff" stroke="#b8d4ff" stroke-width="1.5" rx="14"/><circle cx="117" cy="52" r="28" fill="#2563eb"/><text x="117" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">1</text><text x="117" y="110" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Diagnose</text><text x="117" y="134" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">hermes doctor</text><text x="117" y="153" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">hermes status --all</text></g><g transform="translate(340 196)"><rect width="234" height="176" fill="#fde2e2" stroke="#f3bcbc" stroke-width="1.5" rx="14"/><circle cx="117" cy="52" r="28" fill="#c0392b"/><text x="117" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">2</text><text x="117" y="110" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Model / 404</text><text x="117" y="134" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">hermes model</text><text x="117" y="153" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">cron edit &lt;id&gt;</text></g><g transform="translate(594 196)"><rect width="234" height="176" fill="#fef3c7" stroke="#e9d8a6" stroke-width="1.5" rx="14"/><circle cx="117" cy="52" r="28" fill="#b4841f"/><text x="117" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">3</text><text x="117" y="110" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Credentials</text><text x="117" y="134" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">hermes auth list</text><text x="117" y="153" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">hermes auth reset</text></g><g transform="translate(848 196)"><rect width="234" height="176" fill="#e6f6ec" stroke="#b6e2c6" stroke-width="1.5" rx="14"/><circle cx="117" cy="52" r="28" fill="#1f8a4c"/><text x="117" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">4</text><text x="117" y="110" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Gateway</text><text x="117" y="134" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">gateway restart</text><text x="117" y="153" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">check intents</text></g><text x="88" y="430" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="16">Provider-agnostic: OpenRouter, Anthropic, OpenAI, Google, DeepSeek, local &amp; 20+ more.</text><text x="88" y="458" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="16">Logs: ~/.hermes/logs/gateway.log</text>