<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">KubeCon Japan 2025 and Japan cloud native growth</title>
  <desc id="desc">Editorial thumbnail showing KubeCon Japan 2025 growth metrics and cloud native momentum in Japan.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="54" y="54" width="1092" height="522" rx="18" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
  <text x="92" y="126" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#111827">Japan's Cloud Native Moment</text>
  <text x="94" y="166" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#475569">KubeCon + CloudNativeCon Japan 2025 sold out in Tokyo</text>
  <g transform="translate(92 228)">
    <rect x="0" y="0" width="248" height="166" rx="14" fill="#0066cc"/>
    <text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#ffffff">1,502</text>
    <text x="30" y="110" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#dbeafe">registrations</text>
  </g>
  <g transform="translate(376 228)">
