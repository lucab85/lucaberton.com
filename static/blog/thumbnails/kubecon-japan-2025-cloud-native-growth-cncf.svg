  <circle cx="462" cy="408" r="9" fill="#0f766e"/>
  <circle cx="840" cy="418" r="9" fill="#7c3aed"/>
  <circle cx="1098" cy="432" r="9" fill="#111827"/>
  <text x="92" y="536" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#64748b">Source: KubeCon + CloudNativeCon Japan 2025 transparency report and CNCF press conference coverage</text>
