    <text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#ffffff">746</text>
    <text x="30" y="110" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#ccfbf1">CFPs submitted</text>
  </g>
  <g transform="translate(660 228)">
    <rect x="0" y="0" width="248" height="166" rx="14" fill="#7c3aed"/>
    <text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#ffffff">471</text>
    <text x="30" y="110" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#ede9fe">companies</text>
  </g>
  <g transform="translate(944 228)">
    <rect x="0" y="0" width="154" height="166" rx="14" fill="#111827"/>
    <text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#ffffff">6%</text>
    <text x="30" y="110" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#e5e7eb">CFP acceptance</text>
  </g>
  <path d="M92 468 C220 418, 332 448, 462 408 S710 372, 840 418 S1024 478, 1098 432" fill="none" stroke="#0066cc" stroke-width="8" stroke-linecap="round"/>
