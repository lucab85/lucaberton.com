<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Kubermatic and Kubernetes in Germany</title>
  <desc id="desc">Editorial thumbnail showing Kubermatic as a Kubernetes fleet-management layer for German enterprise sovereignty, compliance, and multi-cloud infrastructure.</desc>
  <rect width="1200" height="630" fill="#f7f8fb"/>
  <rect x="48" y="48" width="1104" height="534" rx="18" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>

  <text x="86" y="122" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#111827">Kubermatic + Kubernetes</text>
  <text x="88" y="160" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#4b5563">German enterprise sovereignty, compliance, and fleet operations</text>

  <g transform="translate(86 210)">
    <rect width="300" height="180" rx="14" fill="#eef2fb" stroke="#c7d3ea" stroke-width="1.5"/>
    <circle cx="150" cy="58" r="30" fill="#8bb7df"/>
    <text x="150" y="67" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">KKP</text>
    <text x="150" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">Fleet Layer</text>
    <text x="150" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">Master, seed, and</text>
    <text x="150" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">user clusters</text>
  </g>

  <g transform="translate(410 210)">
    <rect width="300" height="180" rx="14" fill="#f6efe3" stroke="#e6d6b8" stroke-width="1.5"/>
    <circle cx="150" cy="58" r="30" fill="#caa13c"/>
    <text x="150" y="67" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">DE</text>
    <text x="150" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">Sovereignty</text>
    <text x="150" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">Data, operations,</text>
    <text x="150" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">legal control</text>
  </g>

  <g transform="translate(734 210)">
    <rect width="300" height="180" rx="14" fill="#e9f3ec" stroke="#c3ddc9" stroke-width="1.5"/>
    <circle cx="150" cy="58" r="30" fill="#5fa876"/>
    <text x="150" y="67" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#ffffff">BSI</text>
    <text x="150" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">Compliance</text>
    <text x="150" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">C5, IT-Grundschutz,</text>
    <text x="150" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">audit evidence</text>
  </g>

  <text x="88" y="450" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4b5563">Kubernetes runs workloads. Kubermatic manages Kubernetes clusters as a fleet</text>
  <text x="88" y="478" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4b5563">across cloud, private infrastructure, and edge environments.</text>

  <text x="88" y="552" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b7280">Source: Kubermatic docs, CNCF survey, BSI guidance, 2026</text>
</svg>
