<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">What agent observability actually requires</title>
  <desc id="desc">Editorial thumbnail showing the three pillars of running AI agents in production: observe, evaluate, deploy.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="54" y="54" width="1092" height="522" rx="18" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
  <text x="92" y="126" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#111827">Agent Observability</text>
  <text x="94" y="166" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#475569">An agent can return 200 OK and still be wrong</text>

  <g transform="translate(92 226)">
    <rect x="0" y="0" width="320" height="204" rx="14" fill="#0f766e"/>
    <text x="30" y="56" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Observe</text>
    <text x="30" y="94" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ccfbf1">Trace every tool call,</text>
    <text x="30" y="118" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ccfbf1">prompt version, and</text>
    <text x="30" y="142" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ccfbf1">model call end to end</text>
  </g>
  <g transform="translate(440 226)">
    <rect x="0" y="0" width="320" height="204" rx="14" fill="#7c3aed"/>
    <text x="30" y="56" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Evaluate</text>
    <text x="30" y="94" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ede9fe">Run evals as a CI gate,</text>
    <text x="30" y="118" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ede9fe">catch quality drift, not</text>
    <text x="30" y="142" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ede9fe">just uptime</text>
  </g>
  <g transform="translate(788 226)">
    <rect x="0" y="0" width="266" height="204" rx="14" fill="#111827"/>
    <text x="30" y="56" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Deploy</text>
    <text x="30" y="94" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e5e7eb">Cost per resolved</text>
    <text x="30" y="118" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e5e7eb">task, rollback on</text>
    <text x="30" y="142" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e5e7eb">regression</text>
  </g>

  <text x="92" y="500" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#64748b">Framing inspired by LangSmith: The Agent Engineering Platform (LangChain)</text>
</svg>
