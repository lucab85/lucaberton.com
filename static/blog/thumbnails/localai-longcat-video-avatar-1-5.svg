<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" aria-labelledby="title desc" viewBox="0 0 1200 630"><title>LocalAI LongCat-Video-Avatar 1.5</title><desc>Run an open-source audio-driven talking avatar locally with LocalAI and Meituan LongCat-Video-Avatar 1.5.</desc><path fill="#f7f8fb" d="M0 0h1200v630H0z"/><rect width="1104" height="534" x="48" y="48" fill="#fff" stroke="#d8dee9" stroke-width="2" rx="18"/><text x="86" y="118" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">LocalAI + LongCat-Video-Avatar 1.5</text><text x="88" y="154" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="20">Open-source audio-driven talking avatars, fully self-hosted</text><g transform="translate(86 196)"><rect width="234" height="176" fill="#e0ecff" stroke="#b8d4ff" stroke-width="1.5" rx="14"/><circle cx="117" cy="52" r="28" fill="#2563eb"/><text x="117" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">1</text><text x="117" y="110" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Install</text><text x="117" y="134" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">local-ai models install</text><text x="117" y="153" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">longcat-video-avatar-1.5</text></g><g transform="translate(340 196)"><rect width="234" height="176" fill="#e6fbf0" stroke="#b6eccf" stroke-width="1.5" rx="14"/><circle cx="117" cy="52" r="28" fill="#0f9d58"/><text x="117" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">2</text><text x="117" y="110" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Prompt + media</text><text x="117" y="134" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">text + portrait</text><text x="117" y="153" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">+ speech audio</text></g><g transform="translate(594 196)"><rect width="234" height="176" fill="#fff4e0" stroke="#f3d9a8" stroke-width="1.5" rx="14"/><circle cx="117" cy="52" r="28" fill="#d97706"/><text x="117" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">3</text><text x="117" y="110" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Generate</text><text x="117" y="134" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">POST /video</text><text x="117" y="153" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">8-step distill</text></g><g transform="translate(848 196)"><rect width="234" height="176" fill="#f3e8ff" stroke="#d8bcf6" stroke-width="1.5" rx="14"/><circle cx="117" cy="52" r="28" fill="#7c3aed"/><text x="117" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">4</text><text x="117" y="110" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Ship</text><text x="117" y="134" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">25 FPS talking</text><text x="117" y="153" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">video, no API</text></g><text x="86" y="430" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="16">MIT licensed · Whisper-Large lip sync · NVIDIA CUDA 12/13 only</text><text x="86" y="458" fill="#9ca3af" font-family="Arial, Helvetica, sans-serif" font-size="14">LocalAI 4.7.0 longcat-video backend