<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" aria-labelledby="title desc" viewBox="0 0 1200 630"><title>Nike Mind: when footwear design meets neuroscience</title><desc>Nike Mind 001 and 002 use 22 independently moving foam nodes and EEG research to change sensory input from the feet, aiming for calm focus rather than speed.</desc><path fill="#f7f8fb" d="M0 0h1200v630H0z"/><rect width="1104" height="534" x="48" y="48" fill="#fff" stroke="#d8dee9" stroke-width="2" rx="18"/><text x="86" y="118" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Nike Mind</text><text x="88" y="154" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="21">When footwear design meets neuroscience</text><g transform="translate(86 210)"><rect width="500" height="140" fill="#eef2fb" stroke="#c7d3ea" stroke-width="1.5" rx="14"/><text x="40" y="65" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">22</text><text x="40" y="100" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">independently moving foam nodes per shoe</text></g><g transform="translate(618 210)"><rect width="500" height="140" fill="#111827" rx="14"/><text x="40" y="65" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">EEG-informed</text><text x="40" y="100" fill="#d1d5db" font-family="Arial, Helvetica, sans-serif" font-size="18">design for calm focus, not speed</text></g><text x="88" y="452" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">Nike Mind 001 and 002 change sensory input from the feet,</text><text x="88" y="480" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">built on neuroscience research rather than performance metrics.</text><text x="88" y="552" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="15">lucaberton.com &#8226; Sports Tech, 2026</text></svg>
