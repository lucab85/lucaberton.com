<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" aria-labelledby="title desc" viewBox="0 0 1200 630"><title>OpenAI reportedly explores a bot-free social network</title><desc>OpenAI is reportedly exploring a human-only social network using biometric verification, such as Face ID or World's iris-scanning Orb, for proof-of-personhood.</desc><path fill="#f7f8fb" d="M0 0h1200v630H0z"/><rect width="1104" height="534" x="48" y="48" fill="#fff" stroke="#d8dee9" stroke-width="2" rx="18"/><text x="86" y="118" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">A Bot-Free Social Network?</text><text x="88" y="154" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="21">OpenAI reportedly explores proof-of-personhood</text><g transform="translate(86 210)"><rect width="500" height="140" fill="#fde2e2" stroke="#f3bcbc" stroke-width="1.5" rx="14"/><text x="40" y="60" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Face ID</text><text x="40" y="95" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">Biometric verification</text><text x="40" y="118" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">of a real human user</text></g><g transform="translate(618 210)"><rect width="500" height="140" fill="#111827" rx="14"/><text x="40" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">World's Orb</text><text x="40" y="95" fill="#d1d5db" font-family="Arial, Helvetica, sans-serif" font-size="18">Iris-scanning proof</text><text x="40" y="118" fill="#d1d5db" font-family="Arial, Helvetica, sans-serif" font-size="18">of personhood</text></g><text x="88" y="452" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">A social network built around proving a real person is behind</text><text x="88" y="480" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">every account, as AI-generated content becomes indistinguishable.</text><text x="88" y="552" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="15">lucaberton.com &#8226; AI &amp; Social Networks, 2026</text></svg>
