<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" aria-labelledby="title desc" viewBox="0 0 1200 630"><title>Reinstall Fedora on a Lenovo laptop via USB, no CD needed</title><desc>Four-step editorial thumbnail: create a bootable USB, boot the Lenovo via the F12 menu, erase the disk, install and update to the latest Fedora.</desc><path fill="#f7f8fb" d="M0 0h1200v630H0z"/><rect width="1104" height="534" x="48" y="48" fill="#fff" stroke="#d8dee9" stroke-width="2" rx="18"/><text x="86" y="118" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">Reinstall Fedora on a Lenovo</text><text x="88" y="154" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="21">No CD drive needed &#8212; just a USB stick</text><g transform="translate(86 196)"><rect width="234" height="176" fill="#eef2fb" stroke="#c7d3ea" stroke-width="1.5" rx="14"/><circle cx="117" cy="52" r="28" fill="#3c6bb0"/><text x="117" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">1</text><text x="117" y="110" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Create USB</text><text x="117" y="134" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Fedora Media Writer</text><text x="117" y="153" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">or dd on macOS</text></g><g transform="translate(340 196)"><rect width="234" height="176" fill="#fef3c7" stroke="#e9d8a6" stroke-width="1.5" rx="14"/><circle cx="117" cy="52" r="28" fill="#b4841f"/><text x="117" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">2</text><text x="117" y="110" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Boot via F12</text><text x="117" y="134" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">One-time boot menu</text><text x="117" y="153" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">or the Novo button</text></g><g transform="translate(594 196)"><rect width="234" height="176" fill="#fde2e2" stroke="#f3bcbc" stroke-width="1.5" rx="14"/><circle cx="117" cy="52" r="28" fill="#c0392b"/><text x="117" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">3</text><text x="117" y="110" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Erase disk</text><text x="117" y="134" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Select internal SSD</text><text x="117" y="153" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">not the USB drive</text></g><g transform="translate(848 196)"><rect width="238" height="176" fill="#111827" rx="14"/><circle cx="119" cy="52" r="28" fill="#2f7d4f"/><text x="119" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">4</text><text x="119" y="110" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Install &amp; update</text><text x="119" y="134" fill="#d1d5db" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">dnf upgrade --refresh</text><text x="119" y="153" fill="#d1d5db" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Fedora 44</text></g><text x="88" y="452" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">Covers the macOS &quot;app is damaged&quot; Gatekeeper fix and a dd fallback</text><text x="88" y="480" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">for creating the installer when Fedora Media Writer won&apos;t open.</text><text x="88" y="552" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="15">lucaberton.com &#8226; Fedora Workstation 44, July 2026</text></svg>
