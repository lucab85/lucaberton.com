<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The right amount of spec for AI agents</title>
  <desc id="desc">Editorial thumbnail showing a spectrum from vague intent to strong contracts, spanning personal purpose frameworks and agentic software specs.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="54" y="54" width="1092" height="522" rx="18" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
  <text x="92" y="126" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#111827">The Right Amount of Spec</text>
  <text x="94" y="166" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#475569">For your life, your team, and your code</text>

  <g transform="translate(92 220)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#64748b" letter-spacing="1">LESS SPEC</text>
  </g>
  <g transform="translate(1000 220)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#64748b" letter-spacing="1" text-anchor="end">MORE SPEC</text>
  </g>
  <rect x="92" y="236" width="1016" height="14" rx="7" fill="url(#grad1)"/>
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <g transform="translate(92 288)">
    <rect x="0" y="0" width="228" height="150" rx="14" fill="#fef3c7"/>
    <text x="24" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#92400e">Exploratory work</text>
    <text x="24" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#78350f">Constraints and</text>
    <text x="24" y="92" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#78350f">boundaries only</text>
  </g>
  <g transform="translate(345 288)">
    <rect x="0" y="0" width="228" height="150" rx="14" fill="#fed7aa"/>
    <text x="24" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#9a3412">Bounded tasks</text>
    <text x="24" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#7c2d12">Goal, examples,</text>
    <text x="24" y="92" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#7c2d12">acceptance criteria</text>
  </g>
  <g transform="translate(598 288)">
    <rect x="0" y="0" width="228" height="150" rx="14" fill="#fecaca"/>
    <text x="24" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#991b1b">Deterministic work</text>
    <text x="24" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#7f1d1d">Specs plus</text>
    <text x="24" y="92" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#7f1d1d">executable tests</text>
  </g>
  <g transform="translate(851 288)">
    <rect x="0" y="0" width="257" height="150" rx="14" fill="#111827"/>
    <text x="24" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Multi-agent systems</text>
    <text x="24" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e5e7eb">Strong contracts</text>
    <text x="24" y="92" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e5e7eb">at every handoff</text>
  </g>

  <text x="92" y="500" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#64748b">Framework synthesized from Daniel Miessler's Telos and O'Reilly Radar, "The Right Amount of Spec for Agentic Development"</text>
</svg>
