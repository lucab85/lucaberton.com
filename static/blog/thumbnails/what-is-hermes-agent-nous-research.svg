<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" aria-labelledby="title desc" viewBox="0 0 1200 630"><title>What is Hermes Agent?</title><desc>Overview diagram of Hermes Agent: persistent memory, a bundled skills library, messaging gateways, and flexible model support.</desc><path fill="#f7f8fb" d="M0 0h1200v630H0z"/><rect width="1104" height="534" x="48" y="48" fill="#fff" stroke="#d8dee9" stroke-width="2" rx="18"/><text x="86" y="118" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">What is Hermes Agent?</text><text x="88" y="154" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="21">Nous Research's self-improving, open-source AI agent</text><g transform="translate(86 196)"><rect width="234" height="176" fill="#eef2fb" stroke="#c7d3ea" stroke-width="1.5" rx="14"/><circle cx="117" cy="52" r="28" fill="#3c6bb0"/><text x="117" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">M</text><text x="117" y="110" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Memory</text><text x="117" y="134" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Persists across</text><text x="117" y="153" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">every session</text></g><g transform="translate(340 196)"><rect width="234" height="176" fill="#fef3c7" stroke="#e9d8a6" stroke-width="1.5" rx="14"/><circle cx="117" cy="52" r="28" fill="#b4841f"/><text x="117" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">S</text><text x="117" y="110" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Skills</text><text x="117" y="134" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">~78 bundled,</text><text x="117" y="153" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">self-authored more</text></g><g transform="translate(594 196)"><rect width="234" height="176" fill="#fde2e2" stroke="#f3bcbc" stroke-width="1.5" rx="14"/><circle cx="117" cy="52" r="28" fill="#c0392b"/><text x="117" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">C</text><text x="117" y="110" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Channels</text><text x="117" y="134" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Telegram, Discord,</text><text x="117" y="153" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Slack &amp; more</text></g><g transform="translate(848 196)"><rect width="238" height="176" fill="#111827" rx="14"/><circle cx="119" cy="52" r="28" fill="#2f7d4f"/><text x="119" y="60" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">300+</text><text x="119" y="110" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Models</text><text x="119" y="134" fill="#d1d5db" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Nous Portal, OpenAI,</text><text x="119" y="153" fill="#d1d5db" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Anthropic &amp; more</text></g><text x="88" y="452" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">MIT-licensed and runs on your own server — persistent memory,</text><text x="88" y="480" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">a skills library that grows on its own, reachable from your phone.</text><text x="88" y="552" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="15">lucaberton.com &#8226; Hermes Agent, July 2026</text></svg>
