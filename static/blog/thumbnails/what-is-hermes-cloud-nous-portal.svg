<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" aria-labelledby="title desc" viewBox="0 0 1200 630"><title>What is Hermes Cloud?</title><desc>Hermes Cloud runs a dedicated, always-on Hermes Agent instance for you inside Nous Portal, billed hourly and scaling to zero when idle.</desc><path fill="#f7f8fb" d="M0 0h1200v630H0z"/><rect width="1104" height="534" x="48" y="48" fill="#fff" stroke="#d8dee9" stroke-width="2" rx="18"/><text x="86" y="118" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">What is Hermes Cloud?</text><text x="88" y="154" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="21">Running Hermes Agent without your own server</text><g transform="translate(86 196)"><rect width="309" height="176" fill="#eef2fb" stroke="#c7d3ea" stroke-width="1.5" rx="14"/><circle cx="40" cy="46" r="24" fill="#3c6bb0"/><text x="40" y="53" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">1</text><text x="76" y="53" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Pick model &amp; size</text><text x="30" y="100" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="15">In Nous Portal</text><text x="30" y="124" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="15">~60 seconds to live</text></g><g transform="translate(415 196)"><rect width="309" height="176" fill="#fef3c7" stroke="#e9d8a6" stroke-width="1.5" rx="14"/><circle cx="40" cy="46" r="24" fill="#b4841f"/><text x="40" y="53" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">2</text><text x="76" y="53" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Hourly billing</text><text x="30" y="100" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="15">From Nous credit</text><text x="30" y="124" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="15">Scales to zero when idle</text></g><g transform="translate(744 196)"><rect width="342" height="176" fill="#111827" rx="14"/><circle cx="40" cy="46" r="24" fill="#2f7d4f"/><text x="40" y="53" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">3</text><text x="76" y="53" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">No server management</text><text x="30" y="100" fill="#d1d5db" font-family="Arial, Helvetica, sans-serif" font-size="15">Own workspace &amp; dashboard</text><text x="30" y="124" fill="#d1d5db" font-family="Arial, Helvetica, sans-serif" font-size="15">Team access controls</text></g><text x="88" y="452" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">Nous Portal ties together model access, the Tool Gateway, and</text><text x="88" y="480" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">Hermes Cloud under one account and one invoice.</text><text x="88" y="552" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="15">lucaberton.com &#8226; Hermes Cloud &amp; Nous Portal, July 2026</text></svg>
